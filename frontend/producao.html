<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Just in Time - Produção</title>

    <link rel="stylesheet" href="css/producao.css">
</head>

<body>

    <header>

        <h1>Produção</h1>

        <a href="index.html">Voltar</a>

    </header>

    <main>

        <section class="movimentacao">

            <h2>Registrar movimentação</h2>

            <form id="formProducao">

                <label for="produto">Produto</label>

                <select id="produto" required>
                    <option value="">Selecione um produto</option>
                </select>


                <label for="tipo">Tipo de movimentação</label>

                <select id="tipo" required>

                    <option value="">
                        Selecione
                    </option>

                    <option value="fabricado">
                        Fabricado
                    </option>

                    <option value="pedido">
                        Pedido
                    </option>

                </select>


                <label for="quantidade">Quantidade</label>

                <input
                    type="number"
                    id="quantidade"
                    min="1"
                    required
                >


                <label for="data">Data</label>

                <input
                    type="date"
                    id="data"
                    required
                >


                <button type="submit">
                    Registrar
                </button>

            </form>

            <p id="mensagem"></p>

        </section>


        <section class="estoque">

            <h2>Estoque atual</h2>

            <table>

                <thead>

                    <tr>
                        <th>Produto</th>
                        <th>Estoque</th>
                        <th>Estoque mínimo</th>
                    </tr>

                </thead>

                <tbody id="listaEstoque"></tbody>

            </table>

        </section>


        <section class="historico">

            <h2>Histórico de movimentações</h2>

            <table>

                <thead>

                    <tr>
                        <th>Produto</th>
                        <th>Tipo</th>
                        <th>Quantidade</th>
                        <th>Data</th>
                        <th>Usuário</th>
                    </tr>

                </thead>

                <tbody id="listaProducao"></tbody>

            </table>

        </section>

    </main>

    <script src="js/producao.js"></script>

</body>

</html>
